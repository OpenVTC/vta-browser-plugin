<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PNM</title>
    <!-- Colours, fonts and form-control resets come from src/theme.css,
         imported by popup.tsx. The popup used to set no background at all and
         so rendered white against a dark options page; the token sheet is what
         keeps the two surfaces one product. Only geometry lives here. -->
    <style>
      body {
        /* Chrome caps extension popups at ~800px wide; go near that so
           long DIDs and the action buttons aren't clipped. */
        width: 760px;
        min-height: 240px;
      }
      /* A <select> sizes to its widest option (long DIDs), which would force
         horizontal overflow and clip the popup. Let it ellipsize instead. */
      select {
        width: 100%;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup.tsx"></script>
  </body>
</html>
